<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F1320" />
    <title>GameCafe Manager - Run your gaming café from your phone</title>
    <meta
      name="description"
      content="Track every PC and console, bill customers automatically, and see what you earned today. Simple management software for gaming cafés."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="GameCafe Manager - Run your gaming café from your phone"
    />
    <meta
      property="og:description"
      content="Track every PC and console, bill automatically, and see today's earnings. Free for 15 days."
    />
    <meta name="twitter:card" content="summary" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>"
    />
    <script>
      // Sets the saved theme before the page paints, so there is no flash of the wrong theme.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("theme") || "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
